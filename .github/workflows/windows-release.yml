name: Windows build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check project version and release tag
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/LMUDualSenseHaptics/LMUDualSenseHaptics.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-z0-9.-]+)?$') { throw 'Invalid project version' }
          $tag = [string]$project.Project.PropertyGroup.ReleaseTag
          if ($tag -notmatch '^v[0-9][a-zA-Z0-9.-]*$') { throw 'Invalid release tag' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Release tag must match the project version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static source checks
        run: python scripts/check-source.py
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Replay regression checks
        run: python scripts/verify-replays.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ steps.version.outputs.tag }}
          path: |
            artifacts/LMUDualSenseHaptics-win-x64-${{ steps.version.outputs.tag }}.zip
            artifacts/LMUDualSenseHaptics-win-x64-${{ steps.version.outputs.tag }}.zip.sha256
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            artifacts/build-logs/
            artifacts/validation/
          if-no-files-found: ignore

  release:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/preview/v1.2' && contains(github.event.head_commit.message, '[publish-preview]')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-x64-*
          merge-multiple: true
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$RELEASE_COMMIT")
          fi
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 \
            --title "LMU DualSense Haptics $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
